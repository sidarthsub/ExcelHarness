<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Harness Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: 'SF Mono', 'Fira Code', monospace; padding: 40px; }
  h1 { font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  #brief { font-size: 13px; color: #555; margin-bottom: 24px; font-style: italic; }
  #status { font-size: 48px; font-weight: 700; margin-bottom: 12px; transition: all 0.3s; }
  #detail { font-size: 18px; color: #888; margin-bottom: 32px; }
  #meta { font-size: 13px; color: #444; margin-bottom: 32px; }
  #meta span { margin-right: 24px; }

  .columns { display: flex; gap: 40px; }
  .col { flex: 1; min-width: 0; }

  h2 { font-size: 12px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; border-bottom: 1px solid #1a1a1a; padding-bottom: 8px; }

  #activity { max-height: 70vh; overflow-y: auto; }
  .act { font-size: 12px; padding: 3px 0; border-bottom: 1px solid #111; display: flex; gap: 8px; }
  .act .at { color: #333; flex-shrink: 0; width: 70px; }
  .act .agent { flex-shrink: 0; width: 80px; font-weight: 600; }
  .act .body { color: #777; white-space: pre-wrap; word-break: break-word; }
  .agent-planner { color: #7ba3d4; }
  .agent-generator { color: #8bc48b; }
  .agent-evaluator { color: #d4a37b; }
  .agent-eval_formula { color: #d4a37b; }
  .agent-eval_visual { color: #c49ad4; }
  .kind-error { color: #e04a4a !important; }
  .kind-done { color: #4ae04a !important; }
  .kind-tool { color: #9a9ad0 !important; font-style: italic; }
  .kind-result { color: #555 !important; font-size: 11px; }

  .entry { font-size: 13px; color: #555; padding: 4px 0; }
  .entry .time { color: #333; margin-right: 12px; }
  .phase-planning   { color: #7ba3d4; }
  .phase-generating { color: #8bc48b; }
  .phase-dumping    { color: #9a9ad0; }
  .phase-evaluating { color: #d4a37b; }
  .phase-passed     { color: #4ae04a; }
  .phase-failed     { color: #e04a4a; }
  .phase-complete   { color: #4ae04a; }
  .phase-ingesting  { color: #b09ad0; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
  <h1>Spreadsheet Harness</h1>
  <div id="brief"></div>
  <div id="status">Waiting...</div>
  <div id="detail">No status yet</div>
  <div id="meta"></div>
  <div class="columns">
    <div class="col">
      <h2>Agent Activity</h2>
      <div id="activity"></div>
    </div>
    <div class="col">
      <h2>Phase Log</h2>
      <div id="log"></div>
    </div>
  </div>
<script>
const phases = {
  planning: "\u{1F4CB}", generating: "\u{1F528}", dumping: "\u{1F4F8}", evaluating: "\u{1F50D}",
  passed: "\u{2705}", failed: "\u{274C}", complete: "\u{1F3C1}", ingesting: "\u{1F4E5}"
};
const phaseHistory = [];
let lastDetail = '';
let lastActivityLen = 0;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function poll() {
  try {
    const r = await fetch('status.json?' + Date.now());
    if (!r.ok) return;
    const s = await r.json();
    const icon = phases[s.phase] || "\u{23F3}";
    const el = document.getElementById('status');
    el.textContent = `${icon} ${s.phase}`;
    el.className = `phase-${s.phase}`;

    document.getElementById('detail').textContent = s.detail;
    if (s.brief) document.getElementById('brief').textContent = s.brief;

    let meta = '';
    if (s.run) meta += `<span>Run: ${s.run}</span>`;
    if (s.progress) meta += `<span>Progress: ${s.progress}</span>`;
    if (s.sprint) meta += `<span>Sprint: ${s.sprint}</span>`;
    if (s.attempt) meta += `<span>Attempt: ${s.attempt}</span>`;
    if (s.sheets) meta += `<span>Sheets: ${s.sheets.join(', ')}</span>`;
    document.getElementById('meta').innerHTML = meta;

    // Phase log
    if (s.detail !== lastDetail) {
      lastDetail = s.detail;
      const time = new Date(s.updated_at).toLocaleTimeString();
      phaseHistory.unshift({ time, phase: s.phase, detail: s.detail });
      document.getElementById('log').innerHTML = phaseHistory.slice(0, 50).map(h =>
        `<div class="entry"><span class="time">${h.time}</span><span class="phase-${h.phase}">${phases[h.phase] || "\u{23F3}"} ${esc(h.detail)}</span></div>`
      ).join('');
    }

    // Agent activity feed
    const acts = s.activity || [];
    if (acts.length !== lastActivityLen) {
      lastActivityLen = acts.length;
      const actEl = document.getElementById('activity');
      // Show newest first
      const kindIcons = { text: "\u{1F4AC}", tool: "\u{1F527}", result: "\u{2190}", error: "\u{274C}", done: "\u{2705}", stderr: "\u{1F4DD}", stream: "\u{270F}", thinking: "\u{1F4AD}" };
      actEl.innerHTML = acts.slice().reverse().map(a => {
        const time = new Date(a.t).toLocaleTimeString();
        const icon = kindIcons[a.kind] || "";
        return `<div class="act">` +
          `<span class="at">${time}</span>` +
          `<span class="agent agent-${a.agent}">${a.agent}</span>` +
          `<span class="body kind-${a.kind}">${icon} ${esc(a.text)}</span>` +
          `</div>`;
      }).join('');
      // Auto-scroll to top (newest)
      actEl.scrollTop = 0;
    }
  } catch (e) { /* status.json doesn't exist yet */ }
}
setInterval(poll, 500);
poll();
</script>
</body>
</html>
