<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Excel Harness Bridge v2</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 16px; background: #1a1a1a; color: #ccc; font-size: 13px; }
        #status { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        #log { font-family: 'SF Mono', monospace; font-size: 11px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; background: #111; padding: 8px; border-radius: 4px; }
        .ok { color: #4ae04a; }
        .err { color: #e04a4a; }
        .cmd { color: #7ba3d4; }
        button { background: #2F5496; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; margin-bottom: 12px; }
        button:hover { background: #3a65b0; }
        button:disabled { background: #555; cursor: not-allowed; }
        #chatLog { background: #0f0f0f; padding: 10px; border-radius: 4px; min-height: 200px; max-height: 400px; overflow-y: auto; margin: 10px 0; font-family: -apple-system, sans-serif; }
        .chat-msg { padding: 6px 10px; margin: 4px 0; border-radius: 6px; max-width: 90%; }
        .chat-user { background: #1f3864; color: #fff; margin-left: auto; text-align: right; }
        .chat-agent { background: #2a2a2a; color: #ccc; }
        .chat-system { background: #3a2a1a; color: #e0a050; font-style: italic; }
        #chatInputRow { display: flex; gap: 8px; }
        #chatInput { flex: 1; background: #1a1a1a; color: #ccc; border: 1px solid #333; padding: 8px; border-radius: 4px; }
        #chatInput:disabled { opacity: 0.5; }
        #chatSend { background: #2F5496; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        #chatSend:disabled { background: #555; cursor: not-allowed; }
        details#debugLog summary { cursor: pointer; color: #888; margin-top: 12px; }
    </style>
</head>
<body>
    <div id="status">Initializing...</div>
    <button id="runTest" onclick="runTest()" disabled>Run Test</button>
    <div id="chatLog"></div>
    <div id="chatInputRow">
        <input type="text" id="chatInput" placeholder="Type a message..." disabled />
        <button id="chatSend" onclick="sendChat()" disabled>Send</button>
    </div>
    <details id="debugLog">
        <summary>Debug log</summary>
        <div id="log"></div>
    </details>

    <script>
        const statusEl = document.getElementById("status");
        const logEl = document.getElementById("log");
        let ws = null;

        function log(msg, cls) {
            const line = document.createElement("div");
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (cls) line.className = cls;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusEl.className = cls || "";
        }

        function addChatMessage(text, role) {
            const log = document.getElementById("chatLog");
            const msg = document.createElement("div");
            msg.className = `chat-msg chat-${role}`;
            msg.textContent = text;
            log.appendChild(msg);
            log.scrollTop = log.scrollHeight;
        }

        function sendChat() {
            const input = document.getElementById("chatInput");
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: "chat", text: text }));
            addChatMessage(text, "user");
            input.value = "";
        }

        // Handle Enter key
        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("chatInput");
            if (input) {
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        sendChat();
                    }
                });
            }
        });

        // --- Command handlers ---

        const handlers = {
            async createSheet({ name }) {
                return Excel.run(async (ctx) => {
                    const existing = ctx.workbook.worksheets.getItemOrNullObject(name);
                    await ctx.sync();
                    if (!existing.isNullObject) {
                        existing.delete();
                        await ctx.sync();
                    }
                    const sheet = ctx.workbook.worksheets.add(name);
                    sheet.activate();
                    await ctx.sync();
                    return { ok: true, sheet: name };
                });
            },

            async writeValues({ sheet, address, values }) {
                return Excel.run(async (ctx) => {
                    const range = ctx.workbook.worksheets.getItem(sheet).getRange(address);
                    range.values = values;
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async writeFormulas({ sheet, address, formulas }) {
                return Excel.run(async (ctx) => {
                    const range = ctx.workbook.worksheets.getItem(sheet).getRange(address);
                    range.formulas = formulas;
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async readValues({ sheet, address }) {
                return Excel.run(async (ctx) => {
                    const range = ctx.workbook.worksheets.getItem(sheet).getRange(address);
                    range.load("values");
                    await ctx.sync();
                    return { ok: true, values: range.values };
                });
            },

            async formatRange({ sheet, address, format }) {
                return Excel.run(async (ctx) => {
                    const range = ctx.workbook.worksheets.getItem(sheet).getRange(address);
                    const fmt = range.format;

                    if (format.font) {
                        if (format.font.bold !== undefined) fmt.font.bold = format.font.bold;
                        if (format.font.italic !== undefined) fmt.font.italic = format.font.italic;
                        if (format.font.size) fmt.font.size = format.font.size;
                        if (format.font.color) fmt.font.color = format.font.color;
                        if (format.font.name) fmt.font.name = format.font.name;
                    }
                    if (format.fill && format.fill.color) {
                        fmt.fill.color = format.fill.color;
                    }
                    if (format.horizontalAlignment) {
                        fmt.horizontalAlignment = format.horizontalAlignment;
                    }
                    if (format.verticalAlignment) {
                        fmt.verticalAlignment = format.verticalAlignment;
                    }
                    if (format.wrapText !== undefined) {
                        fmt.wrapText = format.wrapText;
                    }
                    if (format.indentLevel !== undefined) {
                        fmt.indentLevel = format.indentLevel;
                    }
                    if (format.borders) {
                        const borderMap = {
                            top: Excel.BorderIndex.edgeTop,
                            bottom: Excel.BorderIndex.edgeBottom,
                            left: Excel.BorderIndex.edgeLeft,
                            right: Excel.BorderIndex.edgeRight,
                        };
                        for (const [side, props] of Object.entries(format.borders)) {
                            if (borderMap[side]) {
                                const border = fmt.borders.getItem(borderMap[side]);
                                if (props.style) border.style = props.style;
                                if (props.color) border.color = props.color;
                                if (props.weight) border.weight = props.weight;
                            }
                        }
                    }
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async setNumberFormat({ sheet, address, format }) {
                return Excel.run(async (ctx) => {
                    const range = ctx.workbook.worksheets.getItem(sheet).getRange(address);
                    range.load("rowCount,columnCount");
                    await ctx.sync();
                    const fmt = Array(range.rowCount).fill(null).map(() =>
                        Array(range.columnCount).fill(format)
                    );
                    range.numberFormat = fmt;
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async setColumnWidths({ sheet, columns }) {
                // Width values are in character units (how Excel displays them).
                // Office.js columnWidth is in points. Convert: 1 char ≈ 7.5 pts at Calibri 11.
                const CHAR_TO_PTS = 7.5;
                return Excel.run(async (ctx) => {
                    const ws = ctx.workbook.worksheets.getItem(sheet);
                    for (const [col, width] of Object.entries(columns)) {
                        const range = ws.getRange(`${col}:${col}`);
                        // If width > 50, assume it's already in points (backwards compat with prototype tests).
                        // Otherwise treat as character units and convert.
                        range.format.columnWidth = width > 50 ? width : width * CHAR_TO_PTS;
                    }
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async autoFitColumns({ sheet, address }) {
                return Excel.run(async (ctx) => {
                    const ws = ctx.workbook.worksheets.getItem(sheet);
                    const range = address ? ws.getRange(address) : ws.getUsedRange();
                    range.format.autofitColumns();
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async autoFitRows({ sheet, address }) {
                return Excel.run(async (ctx) => {
                    const ws = ctx.workbook.worksheets.getItem(sheet);
                    const range = address ? ws.getRange(address) : ws.getUsedRange();
                    range.format.autofitRows();
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async setRowHeights({ sheet, rows }) {
                return Excel.run(async (ctx) => {
                    const ws = ctx.workbook.worksheets.getItem(sheet);
                    for (const [row, height] of Object.entries(rows)) {
                        const range = ws.getRange(`${row}:${row}`);
                        range.format.rowHeight = height;
                    }
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async setIterativeCalculation({ enabled, maxIteration, maxChange }) {
                return Excel.run(async (ctx) => {
                    // Try workbook.iterativeCalculation first, then fall back to application.
                    let iter = ctx.workbook.iterativeCalculation;
                    if (!iter) {
                        // Some Mac builds expose it on application.
                        iter = ctx.workbook.application && ctx.workbook.application.iterativeCalculation;
                    }
                    if (!iter) {
                        return { error: "iterativeCalculation not available on this Office.js runtime" };
                    }
                    if (enabled !== undefined) iter.enabled = enabled;
                    if (maxIteration !== undefined) iter.maxIteration = maxIteration;
                    if (maxChange !== undefined) iter.maxChange = maxChange;
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async readFormat({ sheet, address }) {
                return Excel.run(async (ctx) => {
                    const range = ctx.workbook.worksheets.getItem(sheet).getRange(address);
                    range.format.load("horizontalAlignment,verticalAlignment,wrapText,indentLevel");
                    await ctx.sync();
                    return {
                        ok: true,
                        horizontalAlignment: range.format.horizontalAlignment,
                        verticalAlignment: range.format.verticalAlignment,
                        wrapText: range.format.wrapText,
                        indentLevel: range.format.indentLevel
                    };
                });
            },

            async createTable({ sheet, headerAddress, name, headers, rows, style }) {
                return Excel.run(async (ctx) => {
                    const ws = ctx.workbook.worksheets.getItem(sheet);
                    const table = ws.tables.add(headerAddress, true);
                    if (name) table.name = name;
                    if (headers) table.getHeaderRowRange().values = [headers];
                    if (rows && rows.length) table.rows.add(null, rows);
                    if (style) table.style = style;
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async clearRange({ sheet, address }) {
                return Excel.run(async (ctx) => {
                    const range = ctx.workbook.worksheets.getItem(sheet).getRange(address);
                    range.clear();
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async mergeCells({ sheet, address }) {
                return Excel.run(async (ctx) => {
                    const range = ctx.workbook.worksheets.getItem(sheet).getRange(address);
                    range.merge();
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async freezeRows({ sheet, count }) {
                return Excel.run(async (ctx) => {
                    const ws = ctx.workbook.worksheets.getItem(sheet);
                    ws.activate();
                    await ctx.sync();
                    ws.freezePanes.freezeRows(count);
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async createChart({ sheet, type, dataRange, seriesBy, title, top, left, width, height, seriesColors, axisFormat }) {
                return Excel.run(async (ctx) => {
                    const ws = ctx.workbook.worksheets.getItem(sheet);
                    const range = ws.getRange(dataRange);
                    const chart = ws.charts.add(
                        Excel.ChartType[type] || type,
                        range,
                        Excel.ChartSeriesBy[seriesBy] || seriesBy
                    );

                    if (title) {
                        chart.title.visible = true;
                        chart.title.text = title;
                    }
                    if (top !== undefined) chart.top = top;
                    if (left !== undefined) chart.left = left;
                    if (width) chart.width = width;
                    if (height) chart.height = height;

                    await ctx.sync();

                    // Apply series colors
                    if (seriesColors && seriesColors.length > 0) {
                        chart.series.load("count");
                        await ctx.sync();
                        for (let i = 0; i < Math.min(seriesColors.length, chart.series.count); i++) {
                            const series = chart.series.getItemAt(i);
                            series.format.fill.setSolidColor(seriesColors[i]);
                        }
                        await ctx.sync();
                    }

                    // Axis formatting
                    if (axisFormat) {
                        if (axisFormat.valueAxis && axisFormat.valueAxis.numberFormat) {
                            chart.axes.valueAxis.numberFormat = axisFormat.valueAxis.numberFormat;
                        }
                        await ctx.sync();
                    }

                    return { ok: true };
                });
            },

            async deleteSheet({ name }) {
                return Excel.run(async (ctx) => {
                    const sheet = ctx.workbook.worksheets.getItem(name);
                    sheet.delete();
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async getSheetNames() {
                return Excel.run(async (ctx) => {
                    const sheets = ctx.workbook.worksheets;
                    sheets.load("items/name");
                    await ctx.sync();
                    return { ok: true, sheets: sheets.items.map(s => s.name) };
                });
            },

            async batch({ commands }) {
                // Execute multiple commands in sequence
                const results = [];
                for (const cmd of commands) {
                    const handler = handlers[cmd.command];
                    if (!handler) {
                        results.push({ error: `Unknown command: ${cmd.command}` });
                        continue;
                    }
                    try {
                        const r = await handler(cmd.params || {});
                        results.push(r);
                    } catch (e) {
                        results.push({ error: e.message });
                    }
                }
                return { ok: true, results };
            },

            async dumpSheet({ sheet }) {
                return Excel.run(async (ctx) => {
                    const ws = ctx.workbook.worksheets.getItem(sheet);
                    const used = ws.getUsedRange(true /* onlyValues=false, include all */);
                    used.load(["address", "values", "formulas", "numberFormat", "rowCount", "columnCount"]);
                    await ctx.sync();
                    return {
                        ok: true,
                        sheet: sheet,
                        address: used.address,
                        dimensions: { rows: used.rowCount, cols: used.columnCount },
                        values: used.values,
                        formulas: used.formulas,
                        numberFormat: used.numberFormat,
                    };
                });
            },

            async protectWorkbook({ password }) {
                return Excel.run(async (ctx) => {
                    // Protect every worksheet so users can't type into cells.
                    const sheets = ctx.workbook.worksheets;
                    sheets.load("items/name");
                    await ctx.sync();
                    for (const ws of sheets.items) {
                        ws.protection.protect({}, password);
                    }
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async unprotectWorkbook({ password }) {
                return Excel.run(async (ctx) => {
                    const sheets = ctx.workbook.worksheets;
                    sheets.load("items/name");
                    await ctx.sync();
                    for (const ws of sheets.items) {
                        ws.protection.unprotect(password);
                    }
                    await ctx.sync();
                    return { ok: true };
                });
            },

            async saveSnapshot({ path }) {
                // Use the Common API (Office.context.document.getFileAsync) to get
                // the workbook as a base64-encoded xlsx. getFileInBase64() doesn't
                // exist on Mac Excel.
                log("saveSnapshot: starting getFileAsync...", "cmd");
                return new Promise((resolve) => {
                    try {
                        Office.context.document.getFileAsync(
                            Office.FileType.Compressed,
                            { sliceSize: 4194304 },
                            (result) => {
                                log(`saveSnapshot: callback fired, status=${result.status}`, "cmd");
                                if (result.status !== Office.AsyncResultStatus.Succeeded) {
                                    log(`saveSnapshot: FAILED - ${result.error?.message || result.error}`, "err");
                                    resolve({ error: result.error?.message || "getFileAsync failed" });
                                    return;
                                }
                            const file = result.value;
                            const sliceCount = file.sliceCount;
                            log(`saveSnapshot: ${sliceCount} slice(s) to read`, "cmd");
                            const slices = [];
                            let received = 0;

                            function getSlice(index) {
                                log(`saveSnapshot: reading slice ${index+1}/${sliceCount}...`, "cmd");
                                file.getSliceAsync(index, (sliceResult) => {
                                    if (sliceResult.status !== Office.AsyncResultStatus.Succeeded) {
                                        log(`saveSnapshot: slice ${index} FAILED - ${sliceResult.error?.message || sliceResult.error}`, "err");
                                        file.closeAsync();
                                        resolve({ error: sliceResult.error?.message || "getSliceAsync failed" });
                                        return;
                                    }
                                    // Mac returns a plain Array of byte values, not a Uint8Array.
                                    const raw = sliceResult.value.data;
                                    const sliceBytes = raw instanceof Uint8Array ? raw : new Uint8Array(raw);
                                    slices[index] = sliceBytes;
                                    received++;
                                    log(`saveSnapshot: slice ${index+1} done (${sliceBytes.length} bytes), ${received}/${sliceCount}`, "cmd");
                                    if (received === sliceCount) {
                                        file.closeAsync();
                                        log(`saveSnapshot: all slices received, assembling...`, "cmd");
                                        const totalLength = slices.reduce((sum, s) => sum + s.length, 0);
                                        log(`saveSnapshot: total ${totalLength} bytes, converting to base64...`, "cmd");
                                        const combined = new Uint8Array(totalLength);
                                        let offset = 0;
                                        for (const slice of slices) {
                                            combined.set(slice, offset);
                                            offset += slice.length;
                                        }
                                        // Use Blob + FileReader for efficient base64 conversion
                                        const blob = new Blob([combined]);
                                        const reader = new FileReader();
                                        reader.onloadend = () => {
                                            // result is "data:application/octet-stream;base64,XXXX"
                                            const b64 = reader.result.split(",")[1];
                                            log(`saveSnapshot: base64 ready (${b64.length} chars)`, "ok");
                                            resolve({ ok: true, base64: b64 });
                                        };
                                        reader.onerror = () => {
                                            log(`saveSnapshot: FileReader error`, "err");
                                            resolve({ error: "base64 conversion failed" });
                                        };
                                        reader.readAsDataURL(blob);
                                    } else {
                                        getSlice(index + 1);
                                    }
                                });
                            }
                            getSlice(0);
                        }
                    );
                    } catch (e) {
                        log(`saveSnapshot: exception - ${e.message}`, "err");
                        resolve({ error: e.message });
                    }
                });
            },

            async setStatus({ text }) {
                // Updates the status line in the taskpane. No Excel API call — just DOM.
                const el = document.getElementById("status");
                if (el) el.textContent = text;
                return { ok: true };
            }
        };

        // --- WebSocket connection ---

        function connect() {
            setStatus("Connecting...", "cmd");
            ws = new WebSocket("wss://localhost:3001");

            ws.onopen = () => {
                setStatus("Connected", "ok");
                log("Connected to relay server", "ok");
                document.getElementById("runTest").disabled = false;
                document.getElementById("chatInput").disabled = false;
                document.getElementById("chatSend").disabled = false;
                ws.send(JSON.stringify({ type: "hello", client: "officejs-addin" }));
            };

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);

                // Chat messages from the harness
                if (msg.type === "chat") {
                    addChatMessage(msg.text, "agent");
                    return;
                }

                log(`← ${msg.command}(${JSON.stringify(msg.params).substring(0, 80)})`, "cmd");

                const handler = handlers[msg.command];
                if (!handler) {
                    const resp = { id: msg.id, error: `Unknown command: ${msg.command}` };
                    ws.send(JSON.stringify(resp));
                    log(`→ error: unknown command`, "err");
                    return;
                }

                try {
                    const result = await handler(msg.params || {});
                    const resp = { id: msg.id, ...result };
                    ws.send(JSON.stringify(resp));
                    log(`→ ok`, "ok");
                } catch (e) {
                    const resp = { id: msg.id, error: e.message };
                    ws.send(JSON.stringify(resp));
                    log(`→ error: ${e.message}`, "err");
                }
            };

            ws.onclose = () => {
                setStatus("Disconnected — reconnecting...", "err");
                log("Disconnected, retrying in 3s...", "err");
                document.getElementById("chatInput").disabled = true;
                document.getElementById("chatSend").disabled = true;
                setTimeout(connect, 3000);
            };

            ws.onerror = (e) => {
                log(`WebSocket error: ${e.type}`, "err");
            };
        }

        // --- Local test sequence ---
        async function runTest() {
            const btn = document.getElementById("runTest");
            btn.disabled = true;
            log("Running test sequence...", "cmd");

            const SHEET = "Prototype Test";
            let passed = 0, failed = 0;

            const run = async (command, params) => {
                log(`▶ ${command}(${JSON.stringify(params).substring(0, 80)})`, "cmd");
                try {
                    const r = await handlers[command](params);
                    if (r.error) { log(`  → error: ${r.error}`, "err"); failed++; }
                    else { log(`  → ok`, "ok"); passed++; }
                    return r;
                } catch (e) {
                    log(`  → error: ${e.message}`, "err");
                    failed++;
                    return { error: e.message };
                }
            };

            // --- Setup ---
            await run("createSheet", { name: SHEET });

            // --- Section 1: Core data + formulas ---
            await run("writeValues", { sheet: SHEET, address: "A1:D1", values: [["Company", "Revenue", "Growth", "Multiple"]] });
            await run("writeValues", { sheet: SHEET, address: "A2:D6", values: [
                ["ConfigHub", 5000000, 0.15, 6], ["Acme Corp", 12000000, 0.25, 8],
                ["Widget Inc", 3000000, 0.10, 5], ["DataFlow", 8000000, 0.30, 10],
                ["CloudNet", 20000000, 0.20, 7]
            ]});
            await run("writeFormulas", { sheet: SHEET, address: "E1", formulas: [["Valuation"]] });
            await run("writeFormulas", { sheet: SHEET, address: "E2:E6", formulas: [["=B2*D2"],["=B3*D3"],["=B4*D4"],["=B5*D5"],["=B6*D6"]] });

            // --- Section 2: Header formatting (bold, fill, center, bottom border) ---
            await run("formatRange", { sheet: SHEET, address: "A1:E1", format: {
                font: { bold: true, size: 11, color: "#FFFFFF" },
                fill: { color: "#2F5496" },
                horizontalAlignment: "Center",
                borders: { bottom: { style: "Continuous", color: "#1F3864", weight: "Thick" }}
            }});

            // --- Section 3: Number formats ---
            await run("setNumberFormat", { sheet: SHEET, address: "B2:B6", format: "$#,##0" });
            await run("setNumberFormat", { sheet: SHEET, address: "C2:C6", format: "0.0%" });
            await run("setNumberFormat", { sheet: SHEET, address: "E2:E6", format: "$#,##0" });

            // --- Section 4: Column widths + row heights ---
            await run("setColumnWidths", { sheet: SHEET, columns: { A: 120, B: 110, C: 80, D: 80, E: 120 }});
            await run("setRowHeights", { sheet: SHEET, rows: { 1: 24 }});

            // --- Section 5: All four borders on totals row ---
            await run("writeValues", { sheet: SHEET, address: "A8", values: [["Total"]] });
            await run("writeFormulas", { sheet: SHEET, address: "B8", formulas: [["=SUM(B2:B6)"]] });
            await run("writeFormulas", { sheet: SHEET, address: "E8", formulas: [["=SUM(E2:E6)"]] });
            await run("setNumberFormat", { sheet: SHEET, address: "B8", format: "$#,##0" });
            await run("setNumberFormat", { sheet: SHEET, address: "E8", format: "$#,##0" });
            await run("formatRange", { sheet: SHEET, address: "A8:E8", format: {
                font: { bold: true, italic: true },
                borders: {
                    top:    { style: "Continuous", color: "#000000", weight: "Thin" },
                    bottom: { style: "Double",     color: "#000000", weight: "Thick" },
                    left:   { style: "Continuous", color: "#000000", weight: "Thin" },
                    right:  { style: "Continuous", color: "#000000", weight: "Thin" }
                }
            }});

            // --- Section 6: Indent levels (financial model hierarchy) ---
            await run("writeValues", { sheet: SHEET, address: "A10:A13", values: [["Revenue"],["Product"],["Services"],["Total Revenue"]] });
            await run("formatRange", { sheet: SHEET, address: "A10", format: { font: { bold: true }}});
            await run("formatRange", { sheet: SHEET, address: "A11:A12", format: { indentLevel: 1 }});
            await run("formatRange", { sheet: SHEET, address: "A13", format: { font: { bold: true }, indentLevel: 0 }});

            // --- Section 7: centerContinuous (conventions use this instead of merge) ---
            // Text goes only in G1; H1:J1 must stay blank for CenterAcrossSelection to span.
            await run("writeValues", { sheet: SHEET, address: "G1", values: [["Quarterly Forecast"]] });
            await run("formatRange", { sheet: SHEET, address: "G1:J1", format: {
                font: { bold: true, size: 12 },
                horizontalAlignment: "CenterAcrossSelection"
            }});
            // Diagnostic: read the alignment back to see what Excel actually stored.
            const cacCheck = await run("readFormat", { sheet: SHEET, address: "G1" });
            log(`  G1 horizontalAlignment after set: ${cacCheck.horizontalAlignment}`, cacCheck.horizontalAlignment === "CenterAcrossSelection" ? "ok" : "err");
            await run("writeValues", { sheet: SHEET, address: "G2:J2", values: [["Q1","Q2","Q3","Q4"]] });

            // --- Section 8: Vertical alignment + wrapText ---
            await run("writeValues", { sheet: SHEET, address: "G4", values: [["This is a long wrapped note that demonstrates text wrapping and vertical centering in a taller row."]] });
            await run("setRowHeights", { sheet: SHEET, rows: { 4: 60 }});
            await run("formatRange", { sheet: SHEET, address: "G4:J4", format: {
                wrapText: true,
                verticalAlignment: "Center",
                horizontalAlignment: "Left",
                font: { italic: true, name: "Calibri", size: 10 }
            }});

            // --- Section 9: mergeCells ---
            await run("writeValues", { sheet: SHEET, address: "G6", values: [["Merged Cell Example"]] });
            await run("mergeCells", { sheet: SHEET, address: "G6:J6" });
            await run("formatRange", { sheet: SHEET, address: "G6", format: {
                font: { bold: true, color: "#FFFFFF" },
                fill: { color: "#70AD47" },
                horizontalAlignment: "Center"
            }});

            // --- Section 10: Chart ---
            await run("createChart", { sheet: SHEET, type: "ColumnClustered", dataRange: "A1:B6", seriesBy: "Columns", title: "Revenue by Company", top: 280, left: 10, width: 500, height: 300, axisFormat: { valueAxis: { numberFormat: "$#,##0" }}, seriesColors: ["#2F5496"] });

            // --- Section 11: Read back computed values ---
            const vals = await run("readValues", { sheet: SHEET, address: "E2:E8" });
            if (vals.values) log(`  Valuations: ${JSON.stringify(vals.values)}`, "ok");

            // --- Section 12: Freeze panes ---
            await run("freezeRows", { sheet: SHEET, count: 1 });

            // --- Section 13: getSheetNames ---
            const names = await run("getSheetNames", {});
            if (names.sheets) log(`  Sheets: ${JSON.stringify(names.sheets)}`, "ok");

            // --- Section 14: Batch ---
            await run("batch", { commands: [
                { command: "writeValues", params: { sheet: SHEET, address: "L1", values: [["Batched"]] }},
                { command: "writeValues", params: { sheet: SHEET, address: "L2", values: [["Via batch handler"]] }},
                { command: "formatRange", params: { sheet: SHEET, address: "L1", format: { font: { bold: true, color: "#C00000" }}}}
            ]});

            // --- Section 15: Iterative calculation (for circular references) ---
            await run("setIterativeCalculation", { enabled: true, maxIteration: 100, maxChange: 0.001 });
            // Prove it works: A15/B15 reference each other.
            await run("writeValues", { sheet: SHEET, address: "A15", values: [["Iter Demo"]] });
            await run("writeFormulas", { sheet: SHEET, address: "B15", formulas: [["=IFERROR(C15+1,0)"]] });
            await run("writeFormulas", { sheet: SHEET, address: "C15", formulas: [["=IFERROR(B15,0)"]] });
            const iterVals = await run("readValues", { sheet: SHEET, address: "B15:C15" });
            if (iterVals.values) log(`  Iter result: ${JSON.stringify(iterVals.values)}`, "ok");

            // --- Section 16: Excel structured table ---
            await run("writeValues", { sheet: SHEET, address: "A17:C17", values: [["Period","Sales","Costs"]] });
            await run("createTable", {
                sheet: SHEET,
                headerAddress: "A17:C17",
                name: "SalesTable",
                rows: [
                    ["Jan", 50000, 32000],
                    ["Feb", 62000, 38000],
                    ["Mar", 71000, 41000],
                    ["Apr", 68000, 39000]
                ],
                style: "TableStyleMedium2"
            });

            // --- Section 17: Sensitivity table via MAP/LAMBDA (What-If Data Table emulation) ---
            await run("writeValues", { sheet: SHEET, address: "A24", values: [["Sensitivity: Valuation vs Multiple"]] });
            await run("formatRange", { sheet: SHEET, address: "A24", format: { font: { bold: true, size: 11 }}});
            await run("writeValues", { sheet: SHEET, address: "A25:A30", values: [["Multiple"],[5],[6],[7],[8],[9]] });
            await run("writeValues", { sheet: SHEET, address: "B25", values: [["Valuation @ $10M Revenue"]] });
            await run("writeFormulas", { sheet: SHEET, address: "B26", formulas: [["=MAP(A26:A30, LAMBDA(m, 10000000*m))"]] });
            await run("setNumberFormat", { sheet: SHEET, address: "B26:B30", format: "$#,##0" });
            await run("formatRange", { sheet: SHEET, address: "A25:B25", format: {
                font: { bold: true },
                fill: { color: "#D9E1F2" },
                borders: { bottom: { style: "Continuous", color: "#000000", weight: "Thin" }}
            }});

            log(`Test sequence complete. ${passed} passed, ${failed} failed.`, failed ? "err" : "ok");
            btn.disabled = false;
        }

        // --- Init ---
        Office.onReady((info) => {
            log(`Office.js ready (host: ${info.host}, platform: ${info.platform})`);
            connect();
        });
    </script>
</body>
</html>
