- id: payout_method
  matches: ["waterfall", "preference", "pro-rata", "pro rata", "liquidation"]
  answer: "Pure pro-rata on fully diluted (no liquidation preferences)."

- id: cap_table_source
  matches: ["cap table source", "where are shares", "import cap table", "reference cap table"]
  answer: "Use inputs/cap_table.xlsx — import it into the workbook or reference it via formulas. Do not hardcode share counts."

- id: style_adherence
  matches: ["style", "formatting", "layout", "number format"]
  answer: "Follow inputs/style_guide.md for headers, formats, and layout."

- id: exit_scenarios
  matches: ["exit", "valuation", "scenarios", "which valuations"]
  answer: "Exactly 5 exits: $100M, $250M, $500M, $1B, $2B."

- id: sheet_name
  matches: ["sheet name", "what to call the sheet", "name the sheet"]
  answer: "Name it exactly 'Returns Analysis' — no prefix, no suffix."

- id: cap_table_as_holder_rows
  matches: ["option pool row", "cap table structure", "include options", "every share", "all rows", "holder rows", "which holders", "options as holder", "row per holder"]
  answer: "Every cap table row (including the option pool) is a distinct holder row in Returns Analysis. Total FD = SUM of all holder shares. Each holder — including options — gets pro-rata payout = holder_shares × exit_value / total_FD."

- id: results_json_completeness
  matches: ["results.json", "json keys", "what to include", "computed cells", "json fields", "output mapping"]
  answer: "Map all output values to their cells: total_fd, founder_a_pct, founder_a_payout_500m, seed_payout_1b, series_a_payout_2b, total_payout_500m. All values must be live formula cells, not hardcoded."
