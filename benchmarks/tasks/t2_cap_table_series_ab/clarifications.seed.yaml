- id: series_a_pricing
  matches: ["series a price", "series a pricing", "price formula a"]
  answer: "price = pre_money / pre_FD (simple, non-circular)."

- id: series_b_denominator
  matches: ["series b denominator", "series b price", "pre-b fd", "post-a fd as denominator"]
  answer: "price = pre_B_money / post_A_FD (uses Series A's post-money FD)."

- id: pool_topup_rule
  matches: ["option pool", "pool top-up", "pool formula", "pool inclusion"]
  answer: "10% post-B, pre-money inclusion, net of pre-round unallocated. Solve (unalloc + topup) = 10% * (pre_B_FD + new_inv_B + topup)."

- id: cross_sheet_refs
  matches: ["cross-sheet", "reference other sheet", "link sheets"]
  answer: "Series A reads Cap Table; Series B reads Series A. Don't copy numbers — reference."

- id: cap_table_copy
  matches: ["cap table copy", "copy cap table", "reproduce cap table"]
  answer: "Copy the 6 holder rows from the input into the Cap Table sheet (or use bridge.copy_sheet_from_input)."

- id: pool_at_series_a
  matches: ["pool at series a", "option pool series a", "series a pool change"]
  answer: "None — no expansion in this round."

- id: cap_table_initial_data
  matches: ["cap table data", "cap table source", "starting shares", "pre-cap table", "founder shares", "seed investor shares", "initial cap", "source data", "placeholder data"]
  answer: "Use input pre_cap_table.xlsx exactly — do not invent placeholder data. Founder A: 4,000,000 (Common); Founder B: 3,000,000 (Common); Seed 1: 1,500,000 (Preferred Seed); Seed 2: 1,000,000 (Preferred Seed); Options (granted): 300,000; Options (unallocated): 200,000. Total pre-round FD: 10,000,000."

- id: output_keys_snap
  matches: ["output keys", "nine keys", "9 keys", "results.json", "which output keys", "key names", "snake case"]
  answer: "Exactly 9 snake_case keys per results.json: preround_total_fd, series_a_price, series_a_new_investor_shares, post_a_fd, series_b_pre_fd, series_b_price, series_b_new_investor_shares, series_b_pool_topup, post_b_fd."

- id: exit_date_anchoring
  matches: ["exit date", "exit timing", "18 months post", "post-series-b", "exit anchor", "hold period", "xirr date"]
  answer: "Exit date = 18 months after the Series B close date (NOT Series A). If Series B close is at cell D81, then exit_date = DATE(YEAR(D81), MONTH(D81)+18, DAY(D81)). This produces a 2029 exit distinct from D81 and gives Series B a real hold period."
