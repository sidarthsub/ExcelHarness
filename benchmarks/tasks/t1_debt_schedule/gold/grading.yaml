recalc: true
checks:
  - id: amort_sheet_exists
    type: sheet_exists
    sheet: Amortization Schedule
    weight: 0.5

  # --- semantic values via results.json dereference ---
  - id: monthly_payment
    type: output_key
    key: monthly_payment
    expected: 19332.8015294283
    tolerance_abs: 1.0
    require_formula: true
    weight: 1.0
    description: "Flat monthly payment via PMT — must be formula-driven."

  - id: month_1_interest
    type: output_key
    key: month_1_interest
    expected: 5000.0
    tolerance_abs: 1.0
    require_formula: true
    weight: 0.6

  - id: month_1_principal
    type: output_key
    key: month_1_principal
    expected: 14332.8015294283
    tolerance_abs: 1.0
    require_formula: true
    weight: 0.6

  - id: month_60_ending_balance
    type: output_key
    key: month_60_ending_balance
    expected: 0.0
    tolerance_abs: 0.01
    require_formula: true
    weight: 1.0
    description: "Ending balance at month 60 must be within $0.01 of zero."

  - id: total_interest_paid
    type: output_key
    key: total_interest_paid
    expected: 159968.0917658886
    tolerance_abs: 1.0
    require_formula: true
    weight: 1.2

  - id: total_principal_paid
    type: output_key
    key: total_principal_paid
    expected: 1000000.0
    tolerance_abs: 1.0
    require_formula: true
    weight: 0.8
    description: "Sum of principal column = initial principal."
